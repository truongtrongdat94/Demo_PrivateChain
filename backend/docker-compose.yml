name: backend

services:
  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../contract/deployments/backend.env
    environment:
      ConnectionStrings__HashDemo: Host=postgres;Port=5432;Database=hash_demo;Username=hash_demo;Password=hash_demo
      Mqtt__Host: rabbitmq
      Mqtt__Port: "1883"
      Mqtt__Topic: SmartEMS/WaterQuality/+/Reading
      Mqtt__Username: ems
      Mqtt__Password: ems
      Blockchain__RpcUrl: http://host.docker.internal:28546
      Blockchain__AccountPrivateKey: 0x8f2a55949038a9610f50fb23b5883af3b4ecb3c3bb792cbcefbd1542c692be63
      Batcher__IntervalSeconds: "60"
      ASPNETCORE_URLS: http://+:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:25000:8080"
    networks:
      - default
      - broker-net

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hash_demo
      POSTGRES_USER: hash_demo
      POSTGRES_PASSWORD: hash_demo
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/001_create_tables.sql:/docker-entrypoint-initdb.d/001_create_tables.sql:ro
    ports:
      - "127.0.0.1:24832:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hash_demo -d hash_demo"]
      interval: 3s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:9.4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "127.0.0.1:24850:80"

volumes:
  postgres-data:

networks:
  broker-net:
    external: true
    name: broker-net
