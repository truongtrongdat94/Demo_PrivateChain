name: besu-chain

x-besu-healthcheck: &besu-healthcheck
  test:
    - CMD
    - bash
    - -ec
    - >-
      exec 3<>/dev/tcp/127.0.0.1/8545;
      printf 'POST / HTTP/1.1\r\nHost: localhost\r\nContent-Type: application/json\r\nContent-Length: 59\r\nConnection: close\r\n\r\n{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' >&3;
      grep -q '"result"[[:space:]]*:[[:space:]]*"0x539"' <&3
  interval: 3s
  timeout: 3s
  retries: 40
  start_period: 15s

services:
  besu-a:
    image: hyperledger/besu:26.6.1
    user: "0:0"
    entrypoint: ["/opt/besu/bin/besu"]
    restart: unless-stopped
    command:
      - --profile=ENTERPRISE
      - --data-path=/var/lib/besu
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/config/node-key
      - --network-id=1337
      - --p2p-interface=0.0.0.0
      - --p2p-host=192.168.65.254
      - --p2p-port=31311
      - --discovery-enabled=false
      - --static-nodes-file=/config/static-nodes-a.json
      - --nat-method=NONE
      - --min-gas-price=0
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET
      - --host-allowlist=localhost,127.0.0.1,host.docker.internal,besu-a
    volumes:
      - ./config/besu/genesis.json:/config/genesis.json:ro
      - ./config/besu/server-a-key:/config/node-key:ro
      - ./config/besu/static-nodes-a.json:/config/static-nodes-a.json:ro
      - besu-a-data:/var/lib/besu
    ports:
      - "127.0.0.1:28545:8545"
      - "31311:31311/tcp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck: *besu-healthcheck
    networks:
      besu-a-net:
        ipv4_address: 172.33.1.2

  besu-b:
    image: hyperledger/besu:26.6.1
    user: "0:0"
    entrypoint: ["/opt/besu/bin/besu"]
    restart: unless-stopped
    command:
      - --profile=ENTERPRISE
      - --data-path=/var/lib/besu
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/config/node-key
      - --network-id=1337
      - --p2p-interface=0.0.0.0
      - --p2p-host=192.168.65.254
      - --p2p-port=31312
      - --discovery-enabled=false
      - --static-nodes-file=/config/static-nodes.json
      - --nat-method=NONE
      - --min-gas-price=0
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET
      - --host-allowlist=localhost,127.0.0.1,host.docker.internal,besu-b
    volumes:
      - ./config/besu/genesis.json:/config/genesis.json:ro
      - ./config/besu/server-b-key:/config/node-key:ro
      - ./config/besu/static-nodes.json:/config/static-nodes.json:ro
      - besu-b-data:/var/lib/besu
    ports:
      - "127.0.0.1:28546:8545"
      - "31312:31312/tcp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck: *besu-healthcheck
    networks:
      besu-b-net:
        ipv4_address: 172.33.2.2

networks:
  besu-a-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.33.1.0/24
  besu-b-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.33.2.0/24

volumes:
  besu-a-data:
  besu-b-data:
