name: fabric-hash-demo

services:
  orderer:
    image: hyperledger/fabric-orderer:2.5.16
    command: orderer
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: "7050"
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /identity/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /identity/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /identity/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: "[/identity/tls/ca.crt]"
      ORDERER_GENERAL_BOOTSTRAPMETHOD: none
      ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
      ORDERER_ADMIN_TLS_ENABLED: "true"
      ORDERER_ADMIN_TLS_PRIVATEKEY: /identity/tls/server.key
      ORDERER_ADMIN_TLS_CERTIFICATE: /identity/tls/server.crt
      ORDERER_ADMIN_TLS_ROOTCAS: "[/identity/tls/ca.crt]"
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: "[/identity/tls/ca.crt]"
      ORDERER_ADMIN_TLS_CLIENTAUTHREQUIRED: "true"
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9443
    volumes:
      - ./config/fabric/credentials/ordererOrganizations/example.com/orderers/orderer.example.com/msp:/identity/msp:ro
      - ./config/fabric/credentials/ordererOrganizations/example.com/orderers/orderer.example.com/tls:/identity/tls:ro
      - orderer-data:/var/hyperledger/production/orderer
    networks:
      fabric-net:
        aliases:
          - orderer.example.com

  peer0-org1:
    image: hyperledger/fabric-peer:2.5.16
    command: peer node start
    environment: &peer-common
      FABRIC_LOGGING_SPEC: INFO
      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_ADDRESS: peer0.org1.example.com:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.org1.example.com:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org1.example.com:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.org1.example.com:7051
      CORE_PEER_GOSSIP_USELEADERELECTION: "false"
      CORE_PEER_GOSSIP_ORGLEADER: "true"
      CORE_PEER_LOCALMSPID: Org1MSP
      CORE_PEER_MSPCONFIGPATH: /identity/msp
      CORE_PEER_TLS_CERT_FILE: /identity/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /identity/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /identity/tls/ca.crt
      CORE_PEER_FILESYSTEMPATH: /var/hyperledger/production
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9443
    volumes:
      - ./config/fabric/credentials/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/msp:/identity/msp:ro
      - ./config/fabric/credentials/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls:/identity/tls:ro
      - peer0-org1-data:/var/hyperledger/production
    networks:
      fabric-net:
        aliases:
          - peer0.org1.example.com

  peer0-org2:
    image: hyperledger/fabric-peer:2.5.16
    command: peer node start
    environment:
      <<: *peer-common
      CORE_PEER_ADDRESS: peer0.org2.example.com:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.org2.example.com:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org2.example.com:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.org2.example.com:7051
      CORE_PEER_LOCALMSPID: Org2MSP
      CORE_PEER_MSPCONFIGPATH: /identity/msp
      CORE_PEER_TLS_CERT_FILE: /identity/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /identity/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /identity/tls/ca.crt
    volumes:
      - ./config/fabric/credentials/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/msp:/identity/msp:ro
      - ./config/fabric/credentials/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/tls:/identity/tls:ro
      - peer0-org2-data:/var/hyperledger/production
    networks:
      fabric-net:
        aliases:
          - peer0.org2.example.com

  network-init:
    image: hyperledger/fabric-tools:2.5.16
    command: ["bash", "/scripts/network-init.sh"]
    depends_on:
      orderer:
        condition: service_started
      peer0-org1:
        condition: service_started
      peer0-org2:
        condition: service_started
    volumes:
      - ./config/fabric/credentials:/credentials:ro
      - ./config/fabric/hashchannel.block:/config/hashchannel.block:ro
      - ./scripts/fabric/network-init.sh:/scripts/network-init.sh:ro
    networks:
      - fabric-net

  fabric-cli:
    image: hyperledger/fabric-tools:2.5.16
    profiles: ["tools"]
    command: ["bash"]
    stdin_open: true
    tty: true
    volumes:
      - ./config/fabric/credentials:/credentials:ro
      - ./config/fabric/hashchannel.block:/config/hashchannel.block:ro
    networks:
      - fabric-net

networks:
  fabric-net:

volumes:
  orderer-data:
  peer0-org1-data:
  peer0-org2-data:
