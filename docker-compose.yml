name: dotnet-besu-hash-demo

x-besu-healthcheck: &besu-healthcheck
  test:
    - CMD
    - bash
    - -ec
    - >-
      exec 3<>/dev/tcp/127.0.0.1/8545;
      printf 'POST / HTTP/1.1\r\nHost: localhost\r\nContent-Type: application/json\r\nContent-Length: 59\r\nConnection: close\r\n\r\n{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' >&3;
      grep -q '"result"[[:space:]]*:[[:space:]]*"0x539"' <&3
  interval: 3s
  timeout: 3s
  retries: 40
  start_period: 15s

services:
  besu-a:
    image: hyperledger/besu:26.6.1
    user: "0:0"
    entrypoint: ["/opt/besu/bin/besu"]
    restart: unless-stopped
    command:
      - --profile=ENTERPRISE
      - --data-path=/var/lib/besu
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/config/node-key
      - --network-id=1337
      - --p2p-interface=0.0.0.0
      - --p2p-host=192.168.65.254
      - --p2p-port=31311
      - --discovery-enabled=false
      - --nat-method=NONE
      - --min-gas-price=0
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,QBFT,ADMIN
      - --host-allowlist=localhost,127.0.0.1,besu-a
    volumes:
      - ./config/besu/genesis.json:/config/genesis.json:ro
      - ./config/besu/server-a-key:/config/node-key:ro
      - besu-a-data:/var/lib/besu
    ports:
      - "127.0.0.1:28545:8545"
      - "31311:31311/tcp"
    healthcheck: *besu-healthcheck
    networks:
      besu-a-net:
        ipv4_address: 172.31.1.2

  besu-b:
    image: hyperledger/besu:26.6.1
    user: "0:0"
    entrypoint: ["/opt/besu/bin/besu"]
    restart: unless-stopped
    depends_on:
      besu-a:
        condition: service_healthy
    command:
      - --profile=ENTERPRISE
      - --data-path=/var/lib/besu
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/config/node-key
      - --network-id=1337
      - --p2p-interface=0.0.0.0
      - --p2p-host=192.168.65.254
      - --p2p-port=31312
      - --discovery-enabled=false
      - --static-nodes-file=/config/static-nodes.json
      - --nat-method=NONE
      - --min-gas-price=0
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,QBFT,ADMIN
      - --host-allowlist=localhost,127.0.0.1,besu-b
    volumes:
      - ./config/besu/genesis.json:/config/genesis.json:ro
      - ./config/besu/server-b-key:/config/node-key:ro
      - ./config/besu/static-nodes.json:/config/static-nodes.json:ro
      - besu-b-data:/var/lib/besu
    ports:
      - "127.0.0.1:28546:8545"
      - "31312:31312/tcp"
    healthcheck: *besu-healthcheck
    networks:
      besu-b-net:
        ipv4_address: 172.31.2.2

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hash_demo
      POSTGRES_USER: hash_demo
      POSTGRES_PASSWORD: hash_demo
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/001_create_tables.sql:/docker-entrypoint-initdb.d/001_create_tables.sql:ro
    ports:
      - "127.0.0.1:25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hash_demo -d hash_demo"]
      interval: 3s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:9.4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "127.0.0.1:25050:80"

networks:
  besu-a-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.1.0/24
  besu-b-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.2.0/24

volumes:
  besu-a-data:
  besu-b-data:
  postgres-data:
